name: coba2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  geolocator: ^14.0.2


  # Ditambahkan untuk Phase 2 — Firebase Authentication.
  # Jalankan `flutter pub add firebase_core firebase_auth` di project lokal
  # Anda alih-alih menyalin versi di sini — itu akan otomatis mengambil
  # versi terbaru yang kompatibel dengan Flutter/Dart Anda saat ini
  # (di sandbox ini saya tidak punya akses internet untuk mengeceknya).
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3

  # Ditambahkan untuk Peta Global (search lokasi + skala risiko gempa/
  # tsunami). Sama seperti Firebase di atas — jalankan `flutter pub add
  # flutter_map latlong2 http` di project lokal Anda untuk versi terbaru
  # yang kompatibel, alih-alih menyalin versi di sini mentah-mentah.
  # flutter_map = peta berbasis OpenStreetMap, gratis & tanpa API key.
  # latlong2    = tipe LatLng yang dipakai flutter_map.
  # http        = dipakai untuk memanggil Nominatim (search & reverse-
  #               geocoding OpenStreetMap, juga gratis tanpa API key).
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.2.2
  webview_flutter: ^4.14.1
  flutter_local_notifications: 22.3.1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true